<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
    <rect x="50" y="50" width="200" height="100" fill="lightblue" stroke="black" stroke-width="2"/>
    <text x="150" y="100" font-size="16" text-anchor="middle">Client</text>
    
    <rect x="550" y="50" width="200" height="100" fill="lightgreen" stroke="black" stroke-width="2"/>
    <text x="650" y="100" font-size="16" text-anchor="middle">Server</text>
    
    <!-- TLS Handshake -->
    <line x1="250" y1="150" x2="550" y2="150" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="400" y="140" font-size="14" text-anchor="middle">ClientHello</text>
    
    <line x1="550" y1="170" x2="250" y2="170" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="400" y="160" font-size="14" text-anchor="middle">ServerHello</text>
    
    <line x1="250" y1="190" x2="550" y2="190" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="400" y="180" font-size="14" text-anchor="middle">Key Exchange</text>
    
    <line x1="550" y1="210" x2="250" y2="210" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="400" y="200" font-size="14" text-anchor="middle">Server Certificate</text>
    
    <!-- Secure Communication -->
    <line x1="250" y1="250" x2="550" y2="250" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="400" y="240" font-size="14" text-anchor="middle">Encrypted Request</text>
    
    <line x1="550" y1="270" x2="250" y2="270" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="400" y="260" font-size="14" text-anchor="middle">Encrypted Response</text>
    
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
            <path d="M0,0 L10,5 L0,10 Z" fill="black" />
        </marker>
    </defs>
</svg>
